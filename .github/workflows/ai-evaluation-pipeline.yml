name: AI Evaluation Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ai-evaluation-pipeline:
    name: Deterministic AI evaluation pipeline
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: apps/api/src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run pytest

      - name: Run AI evaluation pipeline
        run: uv run python scripts/run_ai_evaluation_pipeline.py --fail-on-warning

      - name: Upload AI evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: ai-evaluation-pipeline-report
          path: .data/ai-evaluation-pipeline-report.json
