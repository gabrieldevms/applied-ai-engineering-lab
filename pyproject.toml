[project]
name = "applied-ai-engineering-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.138.2",
    "httpx>=0.28.1",
    "openai>=2.44.0",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.7.0",
    "pytest>=9.1.1",
    "reportlab>=5.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["apps/api/src"]
testpaths = ["tests"]
cache_dir = ".cache/pytest"
